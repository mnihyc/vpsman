<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/boot-recovery.css" />
    <title>vpsman</title>
  </head>
  <body>
    <div id="root"></div>
    <section
      id="boot-recovery"
      class="bootRecovery"
      role="alert"
      aria-live="assertive"
      data-state="pending"
    >
      <h1>Console could not load</h1>
      <p id="boot-recovery-message">
        Startup was interrupted. No operation was submitted.
      </p>
      <a id="reload-console" href="./">Reload console</a>
      <details id="boot-error-details" hidden>
        <summary>Technical details</summary>
        <span id="boot-error"></span>
      </details>
    </section>
    <script type="module" src="/src/boot-recovery.js"></script>
  </body>
</html>
