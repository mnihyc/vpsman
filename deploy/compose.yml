name: vpsman

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${VPSMAN_DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${VPSMAN_DOCKER_LOG_MAX_FILES:-5}"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vpsman}
      POSTGRES_USER: ${POSTGRES_USER:-vpsman}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ./runtime/postgres/data:/var/lib/postgresql/data
    logging: *default-logging
    networks:
      - backend

  api:
    image: debian:bookworm-slim
    restart: unless-stopped
    stop_grace_period: 30s
    working_dir: /opt/vpsman
    command: ./bin/vpsman-api
    environment:
      VPSMAN_SUITE_CONFIG: /etc/vpsman/vpsman.toml
      VPSMAN_POSTGRES_URL: "postgres://${POSTGRES_USER:-vpsman}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-vpsman}"
      # Container-internal only; this service intentionally has no host API port.
      VPSMAN_API_BIND: 0.0.0.0:8080
      RUST_LOG: "${VPSMAN_API_LOG_FILTER:-warn,vpsman_api=info,tower_http=info}"
    volumes:
      - ./runtime/server/current:/opt/vpsman:ro
      - ./runtime/data:/var/lib/vpsman
      - ./config:/etc/vpsman:rw
      - type: tmpfs
        target: /etc/vpsman/secrets
        read_only: true
      - type: bind
        source: ./config/secrets/vpsman_internal_token
        target: /run/secrets/vpsman_internal_token
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      - postgres
    logging: *default-logging
    networks:
      - backend
      - frontend_api

  gateway:
    image: debian:bookworm-slim
    restart: unless-stopped
    stop_grace_period: 45s
    working_dir: /opt/vpsman
    command: ./bin/vpsman-gateway
    environment:
      VPSMAN_SUITE_CONFIG: /etc/vpsman/vpsman.toml
      # Docker publishes to the container network address, while the host
      # boundary remains loopback-only through the ports mapping below.
      VPSMAN_GATEWAY_BIND: 0.0.0.0:9443
      RUST_LOG: "${VPSMAN_GATEWAY_LOG_FILTER:-warn,vpsman_gateway=info}"
    ports:
      # Keep loopback for local evaluation. Production remote agents require
      # an explicit host/NAT/L4 ingress choice, for example
      # VPSMAN_GATEWAY_PUBLISH=0.0.0.0:9443:9443 plus a restrictive firewall.
      - "${VPSMAN_GATEWAY_PUBLISH:-127.0.0.1:9443:9443}"
    volumes:
      - ./runtime/server/current:/opt/vpsman:ro
      - ./runtime/data:/var/lib/vpsman
      - ./config:/etc/vpsman:ro
      - type: tmpfs
        target: /etc/vpsman/secrets
        read_only: true
      - type: bind
        source: ./config/secrets/vpsman_internal_token
        target: /run/secrets/vpsman_internal_token
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/secrets/vpsman_gateway_private_key_hex
        target: /run/secrets/vpsman_gateway_private_key_hex
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/secrets/vpsman_privilege_verifier_key_hex
        target: /run/secrets/vpsman_privilege_verifier_key_hex
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      - api
    logging: *default-logging
    networks:
      - backend

  worker:
    image: debian:bookworm-slim
    restart: unless-stopped
    stop_grace_period: 30s
    working_dir: /opt/vpsman
    command: ./bin/vpsman-worker
    environment:
      VPSMAN_SUITE_CONFIG: /etc/vpsman/vpsman.toml
      VPSMAN_POSTGRES_URL: "postgres://${POSTGRES_USER:-vpsman}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-vpsman}"
      RUST_LOG: "${VPSMAN_WORKER_LOG_FILTER:-warn,vpsman_worker=info}"
    volumes:
      - ./runtime/server/current:/opt/vpsman:ro
      - ./runtime/data:/var/lib/vpsman
      - ./config:/etc/vpsman:ro
      - type: tmpfs
        target: /etc/vpsman/secrets
        read_only: true
    depends_on:
      - postgres
      - api
    logging: *default-logging
    networks:
      - backend

  frontend:
    image: nginx:1.30-alpine
    restart: unless-stopped
    stop_grace_period: 10s
    ports:
      - "${VPSMAN_FRONTEND_BIND:-127.0.0.1:5173}:80"
    volumes:
      - ./runtime/frontend/current/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    logging: *default-logging
    networks:
      - frontend_api

networks:
  backend:
  frontend_api:
