name: Release Quality Gate

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-quality-gate:
    name: Visible release checks
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vpsman
          POSTGRES_USER: vpsman
          POSTGRES_PASSWORD: vpsman
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vpsman -d vpsman"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      VPSMAN_TEST_POSTGRES_URL: postgres://vpsman:vpsman@127.0.0.1:5432/vpsman
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install musl targets
        run: |
          rustup target add x86_64-unknown-linux-musl
          rustup target add aarch64-unknown-linux-musl

      - name: Prepare musl C tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/musl-tools"

          cat > "$RUNNER_TEMP/musl-tools/x86_64-linux-musl-gcc" <<'SH'
          #!/usr/bin/env sh
          exec clang --target=x86_64-unknown-linux-musl "$@"
          SH

          cat > "$RUNNER_TEMP/musl-tools/aarch64-linux-musl-gcc" <<'SH'
          #!/usr/bin/env sh
          exec clang --target=aarch64-unknown-linux-musl "$@"
          SH

          cat > "$RUNNER_TEMP/musl-tools/x86_64-linux-musl-ar" <<'SH'
          #!/usr/bin/env sh
          exec ar "$@"
          SH

          cat > "$RUNNER_TEMP/musl-tools/aarch64-linux-musl-ar" <<'SH'
          #!/usr/bin/env sh
          exec ar "$@"
          SH

          chmod +x "$RUNNER_TEMP"/musl-tools/*
          echo "$RUNNER_TEMP/musl-tools" >> "$GITHUB_PATH"

          command -v clang
          command -v ar
          PATH="$RUNNER_TEMP/musl-tools:$PATH" command -v x86_64-linux-musl-gcc
          PATH="$RUNNER_TEMP/musl-tools:$PATH" command -v x86_64-linux-musl-ar
          PATH="$RUNNER_TEMP/musl-tools:$PATH" command -v aarch64-linux-musl-gcc
          PATH="$RUNNER_TEMP/musl-tools:$PATH" command -v aarch64-linux-musl-ar

      - name: Cache Cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-quality-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            release-quality-cargo-${{ runner.os }}-

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Audit released migrations
        run: VPSMAN_REQUIRE_RELEASE_TAGS=1 bash scripts/audit-migrations.sh

      - name: Install Rust dependency auditor
        run: bash scripts/install-rust-audit-tool.sh

      - name: Audit Rust dependencies
        run: bash scripts/audit-rust-dependencies.sh

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Audit frontend installer acquisition
        run: bash scripts/audit-frontend-installer-asset.sh

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=moderate

      - name: Docker Compose config
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/compose.yml config

      - name: Release version comparator self-test
        run: python3 .github/scripts/check-release-version-gate.py --self-test

      - name: Component build-number gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/check-build-number-gate.py --self-test
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            published_release_tags="$RUNNER_TEMP/published-release-tags.txt"
            gh release list \
              --repo "$GITHUB_REPOSITORY" \
              --exclude-drafts \
              --limit 1000 \
              --json tagName \
              --jq '.[].tagName' > "$published_release_tags"
            python3 .github/scripts/check-build-number-gate.py \
              --candidate-tag "$GITHUB_REF_NAME" \
              --published-release-tags-file "$published_release_tags"
          else
            python3 .github/scripts/check-build-number-gate.py
          fi

      - name: Deployment bundle reproducibility smoke
        run: bash scripts/smoke-deploy-bundle.sh

      - name: Deploy updater transaction smoke
        run: bash scripts/smoke-deploy-updater.sh

      - name: Agent installer mistake-path smoke
        run: bash scripts/smoke-deploy-install-agent.sh
